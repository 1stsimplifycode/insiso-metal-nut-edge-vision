# Render Blueprint: CPU-only web demo of the inspection pipeline (app/server.py).
services:
  - type: web
    name: insiso-metal-nut-inspection
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: INSISO_THREADS
        value: "1"
